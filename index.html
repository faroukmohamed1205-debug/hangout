<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Will you go out with me?</title>
<style>
:root{--pink:#ff4fb0;--hot:#e0147f;--deep:#6b1f5c;--blush:#ffd6ee;--cream:#fff0f8;--ink:#2a0a24;
--bg1:#ff9bd6;--bg2:#e855c4;--sky:linear-gradient(#8e3fb0 0%,#e855c4 45%,#ff9bb0 75%,#ffc89a 100%);--card:#6b2160;--fg:#fff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#d14fa6;--bg2:#8e2a86;--sky:linear-gradient(#3b1458 0%,#8e2a86 45%,#c9457f 78%,#e08a6a 100%);--card:#4a1445}}
:root[data-theme="dark"]{--bg1:#d14fa6;--bg2:#8e2a86;--sky:linear-gradient(#3b1458 0%,#8e2a86 45%,#c9457f 78%,#e08a6a 100%);--card:#4a1445}
*{box-sizing:inherit}
html,body{margin:0;min-height:100%}
body{background:#e855c4;background-image:var(--sky);background-attachment:fixed;
font-family:ui-monospace,"Courier New",monospace;font-weight:700;color:var(--fg);overflow-x:hidden}
.bg{background-size:cover;background-position:center 55%;position:fixed;inset:0;width:100%;height:100%;z-index:0;pointer-events:none;shape-rendering:crispEdges}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:0;opacity:.1;
background:conic-gradient(#fff 25%,transparent 0 50%,#fff 0 75%,transparent 0) 0 0/28px 28px}
main{position:relative;z-index:1;max-width:520px;margin:0 auto;padding:28px 20px 90px;min-height:100vh;display:flex;flex-direction:column;align-items:center;text-align:center}
.screen{display:none;width:100%;flex-direction:column;align-items:center}
.screen.on{display:flex}
.hint{margin:16px 0 0;font-size:14px;color:var(--cream)}.nav{display:flex;gap:12px;justify-content:space-between;margin-top:20px}.back{background:var(--blush);color:var(--deep)}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{font:inherit;font-size:14px;padding:8px 10px;background:var(--cream);color:var(--ink);border:3px solid var(--pink);border-radius:8px;cursor:pointer;text-align:left}
.wa{background:#25d366;color:#053b1c;border-color:#c9f7da;box-shadow:0 5px 0 #0e7a3a;width:100%;margin-bottom:14px}
.frame{position:relative;width:168px;height:168px;background:var(--ink);border:6px solid var(--blush);box-shadow:0 0 0 4px var(--hot),6px 8px 0 4px var(--deep);display:grid;place-items:center;font-size:80px;margin:20px 0 34px}
.bob{animation:bob 1.2s steps(2) infinite}
@keyframes bob{50%{transform:translateY(-6px)}}
h1{font-size:clamp(30px,9vw,46px);line-height:1.15;margin:0 0 10px;color:var(--cream);letter-spacing:.04em;text-shadow:3px 3px 0 var(--hot),6px 6px 0 var(--deep),0 0 18px rgba(42,10,36,.6)}
.sub{margin:0 0 26px;color:var(--cream);font-size:18px;text-shadow:1px 1px 0 var(--deep),0 0 10px rgba(42,10,36,.8)}
.arena{position:relative;width:100%;height:230px}
.btn{font:inherit;cursor:pointer;border:4px solid var(--blush);color:var(--cream);background:var(--hot);box-shadow:0 5px 0 var(--deep);padding:12px 22px;font-weight:700;font-size:20px}
.btn:active{transform:translateY(4px);box-shadow:0 1px 0 var(--deep)}
.btn:focus-visible,input:focus-visible,.opt:focus-visible,textarea:focus-visible{outline:4px solid #fff59d;outline-offset:3px}
#yes{position:absolute;left:50%;top:10px;transform:translateX(-120%);font-size:34px;padding:16px 34px;transform-origin:center}
#no{position:absolute;left:58%;top:26px;background:var(--blush);color:var(--deep);border-color:#fff;font-size:18px;padding:8px 18px;transition:left .22s steps(4),top .22s steps(4),font-size .2s}
#plead{position:absolute;left:0;right:0;bottom:6px;margin:0;color:var(--cream);font-size:18px;min-height:24px;text-shadow:1px 1px 0 var(--deep),0 0 10px rgba(42,10,36,.8)}
.card{width:100%;background:var(--card);border:6px solid var(--blush);box-shadow:0 0 0 4px var(--hot),6px 8px 0 4px var(--deep);padding:22px 18px;text-align:left;font-family:"Courier New",monospace}
.card label,.card .q{display:block;font-weight:700;margin:16px 0 8px;font-size:16px}
.card label:first-child{margin-top:0}
input[type=date],input[type=time],textarea{width:100%;font:inherit;font-family:"Courier New",monospace;padding:12px;background:var(--cream);color:var(--ink);border:3px solid var(--pink);border-radius:8px;color-scheme:light}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{font:inherit;font-family:"Courier New",monospace;font-size:14px;text-align:left;padding:12px 10px;background:var(--cream);color:var(--ink);border:3px solid var(--pink);border-radius:8px;cursor:pointer}
.opt[aria-pressed=true]{background:#ffb3e3;border-color:var(--hot);box-shadow:inset 0 0 0 2px var(--hot)}
.err{color:#ffe08a;min-height:20px;margin:12px 0 0;font-size:14px}
.send{width:100%;margin-top:10px}
.plan{background:var(--cream);color:var(--ink);padding:14px;border:3px solid var(--pink);border-radius:8px;white-space:pre-wrap;font-family:"Courier New",monospace;text-align:left;width:100%;margin:0 0 18px;line-height:1.5}
.row{display:flex;gap:12px;flex-wrap:wrap;justify-content:center}
.heart{position:fixed;pointer-events:none;font-size:26px;animation:rise 2.4s linear forwards}
@keyframes rise{to{transform:translateY(-110vh) rotate(20deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.bob,.heart{animation:none}#no{transition:none}}
@media (max-width:380px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="bg" id="bg" aria-hidden="true"></div>
<main>
  <section class="screen on" id="s1" aria-live="polite">
    <div class="frame"><span class="bob" id="face" aria-hidden="true">🐱</span></div>
    <h1>Will you go out with me?</h1>
    <div class="arena" id="arena">
      <button class="btn" id="yes" type="button">YES ✦</button>
      <button class="btn" id="no" type="button">No</button>
      <p id="plead">&nbsp;</p>
    </div>
  </section>

  <section class="screen" id="s2">
    <div class="frame"><span class="bob" aria-hidden="true">😻</span></div>
    <h1>When?</h1>
    <p class="sub">Pick the day and the time.</p>
    <div class="card">
      <label for="date">What day works for you?</label>
      <input type="date" id="date">
      <label for="time">And what time?</label>
      <input type="time" id="time">
      <p class="err" id="err2" role="alert"></p>
      <div class="nav"><button class="btn back" data-to="s1" type="button">Back</button><button class="btn" id="n2" type="button">Next ✦</button></div>
    </div>
  </section>

  <section class="screen" id="s3">
    <div class="frame"><span class="bob" aria-hidden="true">🥰</span></div>
    <h1>What shall we do?</h1>
    <p class="sub">Pick one or more.</p>
    <div class="card">
      <div class="grid" role="group" aria-label="Things to do" id="opts">
        <button type="button" class="opt" aria-pressed="false" data-v="Grab some food">🍣 Grab some food</button>
        <button type="button" class="opt" aria-pressed="false" data-v="Coffee or boba">🧋 Coffee or boba</button>
        <button type="button" class="opt" aria-pressed="false" data-v="See a movie">🎬 See a movie</button>
        <button type="button" class="opt" aria-pressed="false" data-v="Take a walk">🌷 Take a walk</button>
        <button type="button" class="opt" aria-pressed="false" data-v="Play games">🎮 Play games</button>
        <button type="button" class="opt" aria-pressed="false" data-v="Surprise me">🎁 Surprise me</button>
      </div>
      <p class="err" id="err3" role="alert"></p>
      <div class="nav"><button class="btn back" data-to="s2" type="button">Back</button><button class="btn" id="n3" type="button">Next ✦</button></div>
    </div>
  </section>

  <section class="screen" id="s4">
    <div class="frame"><span class="bob" aria-hidden="true">💖</span></div>
    <h1>Write a cute message</h1>
    <p class="sub" id="recap"></p>
    <div class="card">
      <label for="msg">Your message</label>
      <textarea id="msg" rows="5"></textarea>
      <span class="q">Need an idea? Tap one:</span>
      <div class="chips" id="chips"></div>
      <p class="hint">A form opens with everything filled in. Tap Submit there and it reaches him.</p>
      <div class="nav" style="flex-direction:column;align-items:stretch;margin-top:12px">
        <button class="btn wa" id="wa" type="button">Send to him 💌</button>
        <button class="btn" id="copy" type="button">Copy message</button>
        <button class="btn back" data-to="s3" type="button">Back</button>
      </div>
    </div>
  </section>
</main>

$('bg').style.backgroundImage='linear-gradient(rgba(107,31,92,.45),rgba(224,20,127,.30)),url('+PHOTO+')';
const FORM='https://docs.google.com/forms/d/e/1FAIpQLSfyzxfAaL7XllzMj_3yFX48BpmhuEHJqY1SNiY8YEprmnAXkA/viewform';
// Labels must match the checkbox options in the form exactly (including its spelling).
const FORM_LABEL={'Grab some food':'Grab some food','Coffee or boba':'Coffe or Boba','See a movie':'see a movie','Take a walk':'take a walk','Play games':'play games','Surprise me':'Surprise me'};
const show=id=>{document.querySelectorAll('.screen').forEach(x=>x.classList.toggle('on',x.id===id));window.scrollTo(0,0)};
const pleas=["Babe please :(","Are you sure?","Think about it again...","The cat is crying now.","I made snacks!","Last chance... (not really)","You can't escape :3","Just press YES already!"];
const faces=["🐱","🥺","😿","😿","🙀","😭","😭","😭"];
let tries=0;

function hearts(n){for(let i=0;i<n;i++){const h=document.createElement('span');h.className='heart';h.textContent=['💖','💗','✨','💕'][i%4];h.style.left=Math.random()*95+'vw';h.style.bottom='-30px';h.style.animationDelay=(Math.random()*.8)+'s';document.body.appendChild(h);setTimeout(()=>h.remove(),3500)}}

function dodge(e){
  if(e&&e.type==='touchstart')e.preventDefault();
  const a=$('arena'),no=$('no'),yes=$('yes');
  tries++;
  const maxX=a.clientWidth-no.offsetWidth,maxY=a.clientHeight-no.offsetHeight-34;
  no.style.left=Math.max(0,Math.random()*maxX)+'px';
  no.style.top=Math.max(0,Math.random()*maxY)+'px';
  $('plead').textContent=pleas[Math.min(tries-1,pleas.length-1)];
  $('face').textContent=faces[Math.min(tries,faces.length-1)];
  yes.style.fontSize=Math.min(34+tries*3,64)+'px';
  no.style.fontSize=Math.max(18-tries,11)+'px';
}
['mouseenter','touchstart','focus'].forEach(ev=>$('no').addEventListener(ev,dodge,{passive:false}));
$('no').addEventListener('click',dodge);

$('yes').addEventListener('click',()=>{hearts(18);setTimeout(()=>show('s2'),700);$('yes').textContent='YES! 💖'});

const picked=new Set();
$('opts').addEventListener('click',e=>{
  const b=e.target.closest('.opt');if(!b)return;
  const on=b.getAttribute('aria-pressed')!=='true';
  b.setAttribute('aria-pressed',on);
  on?picked.add(b.dataset.v):picked.delete(b.dataset.v);
});
const today=new Date();today.setMinutes(today.getMinutes()-today.getTimezoneOffset());
$('date').min=today.toISOString().slice(0,10);

document.querySelectorAll('[data-to]').forEach(b=>b.addEventListener('click',()=>show(b.dataset.to)));
$('n2').addEventListener('click',()=>{
  if(!$('date').value||!$('time').value){$('err2').textContent='Pick both a day and a time.';return}
  $('err2').textContent='';show('s3');
});
const suggestions=["Yes! I can't wait to see you 💖","You made me smile, so I'm in. Don't be late 😘","Okay okay, you win my heart. See you there ✨","Counting down the minutes already 🥺💕"];
function when(){
  const d=$('date').value,t=$('time').value;
  const dt=new Date(d+'T'+t);
  return {day:dt.toLocaleDateString(undefined,{weekday:'long',month:'long',day:'numeric'}),time:dt.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'})};
}
$('n3').addEventListener('click',()=>{
  if(!picked.size){$('err3').textContent='Pick at least one thing to do.';return}
  $('err3').textContent='';
  const w=when();
  $('recap').textContent=w.day+' at '+w.time+' · '+[...picked].join(', ');
  if(!$('msg').value)$('msg').value=suggestions[0];
  show('s4');hearts(12);
});
$('chips').innerHTML=suggestions.map((t,i)=>'<button type="button" class="chip" data-i="'+i+'">'+t+'</button>').join('');
$('chips').addEventListener('click',e=>{const c=e.target.closest('.chip');if(c)$('msg').value=suggestions[c.dataset.i]});
function finalText(){
  const w=when();
  return $('msg').value.trim()+'\n\n📅 '+w.day+'\n⏰ '+w.time+'\n✨ '+[...picked].join(', ');
}
$('wa').addEventListener('click',()=>{
  const q=new URLSearchParams();
  q.set('usp','pp_url');
  q.set('entry.1630619455',$('date').value);
  q.set('entry.940103425',$('time').value);
  picked.forEach(v=>q.append('entry.1639242002',FORM_LABEL[v]||v));
  q.set('entry.1522738968',$('msg').value.trim());
  window.open(FORM+'?'+q.toString(),'_blank','noopener');
});
$('copy').addEventListener('click',async()=>{
  try{await navigator.clipboard.writeText(finalText());$('copy').textContent='Copied!'}
  catch(e){$('copy').textContent='Select the text to copy'}
  setTimeout(()=>$('copy').textContent='Copy message',2000);
});
</script>
</body>
</html>
